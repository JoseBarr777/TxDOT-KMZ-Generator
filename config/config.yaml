# txdot_overlay configuration
#
# Source service URLs and field names below were confirmed by directly
# querying each service's ArcGIS REST metadata (?f=json) and a sample
# attribute query. See docs/FIELD_REFERENCE.md for the full inspection
# record. Do not add fields here without re-running
# `python -m txdot_overlay inspect-sources` to confirm they still exist.

sources:
  districts:
    label: "TxDOT Districts"
    service_url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/TxDOT_Districts/FeatureServer"
    layer_id: 0
    # Confirmed fields (2026-09-12): OBJECTID, TXDOT_DIST_ABRVN_NM, TXDOT_DIST_NBR,
    # TXDOT_DIST_NM, TYPE, DIST_NBR, DIST_NM, DIST_ABRVN, Shape__Area,
    # Shape__Length, Label. DIST_NM/DIST_NBR/DIST_ABRVN are the de-duplicated
    # (non "TXDOT_" prefixed) copies and are what we use.
    fields:
      object_id: "OBJECTID"
      name: "DIST_NM"
      number: "DIST_NBR"
      abbreviation: "DIST_ABRVN"
      area_type: "TYPE"
    description_fields: ["DIST_NM", "DIST_NBR", "DIST_ABRVN", "TYPE"]

  counties:
    label: "Texas County Boundaries (Detailed)"
    service_url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/Texas_County_Boundaries_Detailed/FeatureServer"
    layer_id: 0
    # Confirmed fields (2026-09-12): OBJECTID, GID, CMPTRL_NBR, CNTY_NM, DIST_NM,
    # DPS_NBR, CNTY_FIPS, CNTY_NBR, DIST_NBR, MSA1990/2000/2010, GRID_OP,
    # CREATE_DT, CREATE_NM, EDIT_DT, EDIT_NM, Shape__Area, Shape__Length.
    # CNTY_NBR matches the roadway inventory's CO code (verified: Smith
    # county CNTY_NBR=212 == roadway CO=212). DIST_NM/DIST_NBR already carry
    # each county's TxDOT district, so district assignment for counties is a
    # reliable existing attribute -- no spatial join needed.
    fields:
      object_id: "OBJECTID"
      name: "CNTY_NM"
      number: "CNTY_NBR"
      fips: "CNTY_FIPS"
      district_name: "DIST_NM"
      district_number: "DIST_NBR"
    description_fields: ["CNTY_NM", "CNTY_FIPS", "DIST_NM"]

  roadways:
    label: "TxDOT Roadway Inventory"
    service_url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/TxDOT_Roadway_Inventory/FeatureServer"
    layer_id: 0
    # Confirmed fields (2026-09-12), abbreviated to the ones this project
    # uses; the live service has 140+ inventory/asset fields not listed here.
    # CO/DI are numeric codes (no name text on this layer) -- CO matches
    # counties.CNTY_NBR (verified), so county/district assignment for
    # roadways uses that attribute join first, falling back to a spatial
    # join against county polygons only when CO/DI are missing or invalid.
    #
    # Coded fields (hsys, roadbed_id, dir_trav, hwy_stat, rdway_maint_agcy,
    # admin, f_system, access_control, median_type, inside/outside_shoulder_type)
    # are decoded for display by processing/codes.py using definitions
    # verified against TxDOT's official RIF spec -- see docs/FIELD_REFERENCE.md.
    # None of the ArcGIS service's own field metadata defines coded-value
    # domains for these (checked via inspect-sources: domain is null for all).
    fields:
      object_id: "OBJECTID"
      county_code: "CO"
      district_code: "DI"
      route_id: "RIA_RTE_ID"
      highway_full: "HWY"
      highway_system: "HSYS"
      highway_number: "HNUM"
      highway_suffix: "HSUF"
      street_name: "STE_NAM"
      control_section: "C_SEC"
      roadbed_id: "RDBD_ID"
      direction_of_travel: "DIR_TRAV"
      highway_status: "HWY_STAT"
      maintenance_agency: "RDWAY_MAINT_AGCY"
      admin_system: "ADMIN"
      functional_system: "F_SYSTEM"
      num_lanes: "NUM_LANES"
      lane_width: "LANE_WIDTH"
      surface_width: "SUR_W"
      surface_type: "SRF_TYPE"
      paved_roadbed_width: "PV_RB_WID"
      roadbed_width: "RB_WID"
      median_width: "MED_WID"
      median_type: "MED_TYPE"
      inside_shoulder_width: "S_WID_I"
      inside_shoulder_type: "S_TYPE_I"
      outside_shoulder_width: "S_WID_O"
      outside_shoulder_type: "S_TYPE_O"
      row_min: "ROW_MIN"
      speed_limit: "SPD_MAX"
      access_control: "ACES_CTRL"
      adt_current: "ADT_CUR"
      adt_year: "ADT_YEAR"
      section_length: "LEN_SEC"
      lane_miles: "LN_MILES"
    # Kept for inspect-sources/audit-data field-presence checks; the popup
    # itself is built from grouped sections in export/descriptions.py, not
    # this flat list.
    description_fields:
      - "HWY"
      - "HSYS"
      - "STE_NAM"
      - "RIA_RTE_ID"
      - "C_SEC"
      - "RDBD_ID"
      - "DIR_TRAV"
      - "HWY_STAT"
      - "RDWAY_MAINT_AGCY"
      - "ADMIN"
      - "F_SYSTEM"
      - "NUM_LANES"
      - "LANE_WIDTH"
      - "SUR_W"
      - "PV_RB_WID"
      - "RB_WID"
      - "MED_WID"
      - "MED_TYPE"
      - "S_WID_I"
      - "S_TYPE_I"
      - "S_WID_O"
      - "S_TYPE_O"
      - "ROW_MIN"
      - "SPD_MAX"
      - "ACES_CTRL"
      - "ADT_CUR"
      - "ADT_YEAR"
      - "LEN_SEC"
      - "LN_MILES"

  # City limits: chosen over the CPA/TxGIO "Texas_City_Boundaries" layer
  # after a side-by-side audit (docs/SOURCE_AUDIT.md) -- this TxDOT copy is
  # on the same ArcGIS Online org as every other source this TxDOT-oriented
  # overlay uses, and within the Tyler District bounding box it has 72
  # cities vs. the CPA layer's 70. The two missing from CPA (Hideaway, New
  # London) are both confirmed real incorporated cities; *why* CPA's layer
  # omits them is an unconfirmed hypothesis (Hideaway is confirmed to levy
  # no city sales tax, which is consistent with -- but not proof of -- a
  # gap in a sales-tax-oriented boundary product), not an established root
  # cause -- see docs/SOURCE_AUDIT.md. No per-feature update-date field
  # exists on this layer (confirmed via inspect-sources-style ?f=json
  # metadata check) -- popups cite the service-level audit date instead of
  # a nonexistent per-feature date.
  city_limits:
    label: "TxDOT City Boundaries"
    service_url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/TxDOT_City_Boundaries/FeatureServer"
    layer_id: 0
    fields:
      object_id: "OBJECTID"
      name: "CITY_NM"
      county_seat_flag: "CNTY_SEAT_FLAG"
      population_2022: "POP2022"
      population_2020: "POP2020"
    description_fields: ["CITY_NM", "CNTY_SEAT_FLAG", "POP2022"]

# Parcels are intentionally NOT configured as a live source here. TxGIO's
# candidate parcel service's anonymous `/query` operation returns an ArcGIS
# error for every attempted request (count-only or filtered) even though it
# advertises Query capability; only single-point `/identify` responds. A
# parcel product must not be built on repeated /identify calls (that is not
# a real bulk-query substitute), so parcel generation is deferred pending an
# official bulk download (SCAD or TxGIO) rather than a live REST source --
# see docs/SOURCE_AUDIT.md's "Deferred: future import-parcels workflow"
# section for the planned field scope and the reasoning above.

# Maps the roadway inventory's HSYS code to a styling/route category (which
# KML folder and color a physical road gets). Grade-separated connectors
# (RDBD_ID=GS, officially decoded "Grade Separated Connector") never reach
# this map -- processing/classify.py routes them to
# "grade_separated_connector" first, regardless of HSYS. Every HSYS code below
# is verified from the official RIF spec (see docs/FIELD_REFERENCE.md);
# codes actually observed live in the Tyler District as of 2026-09-12 are
# marked. Anything not listed here (there should be nothing) falls back to
# "county_local_other" via `default`, not silently to a physical-road color.
route_classification:
  IH: interstate              # Interstate -- observed live
  US: us_highway               # US Highway -- observed live
  UA: us_highway               # US Alternate
  SH: state_highway            # State Highway -- observed live
  SA: state_highway            # State Alternate
  PA: state_highway            # Principal Arterial
  FM: fm_rm                    # Farm to Market Road -- observed live
  RM: fm_rm                    # Ranch to Market Road -- observed live
  FS: fm_rm                    # FM Spur -- observed live
  RS: fm_rm                    # RM Spur
  SL: loop_spur_business        # State Loop -- observed live
  SS: loop_spur_business        # State Spur -- observed live
  BI: loop_spur_business        # Business Interstate
  BU: loop_spur_business        # Business US -- observed live
  BS: loop_spur_business        # Business State -- observed live
  BF: loop_spur_business        # Business FM
  PR: loop_spur_business        # Park Road -- observed live
  RE: loop_spur_business        # Rec Road
  RP: loop_spur_business        # Rec Road Spur
  RR: loop_spur_business        # Ranch Road
  RU: loop_spur_business        # RR Spur
  UP: loop_spur_business        # US Spur
  CR: county_local_other       # County Road (off-system) -- observed live
  LS: county_local_other       # (Local) City Street (off-system) -- observed live
  FD: county_local_other       # Federal Road (off-system)
  TL: county_local_other       # Off-System Toll Road -- observed live
  default: county_local_other

styles:
  district_boundary:
    line_color: "#FFC000"    # amber
    line_width: 3.0
    fill: false
    fill_color: "#FFC000"
    fill_opacity: 0.0
  county_boundary:
    line_color: "#CCCCCC"    # light gray
    line_width: 1.0
    fill: false
    fill_color: "#CCCCCC"
    fill_opacity: 0.0
  city_limits_boundary:
    line_color: "#00A0A0"    # restrained teal, distinct from county gray/district amber
    line_width: 1.5
    fill: true
    fill_color: "#00A0A0"
    fill_opacity: 0.05        # transparent fill per requirement -- outline carries the shape
  routes:
    interstate:
      label: "Interstate"
      line_color: "#0000FF"  # blue
      line_width: 3.0
    us_highway:
      label: "US Highway"
      line_color: "#FF0000"  # red
      line_width: 2.5
    state_highway:
      label: "State Highway"
      line_color: "#FFD700"  # gold
      line_width: 2.0
    fm_rm:
      label: "FM / RM Road"
      line_color: "#228B22"  # green
      line_width: 1.5
    loop_spur_business:
      label: "Loop / Spur / Business Route"
      line_color: "#800080"  # purple
      line_width: 1.5
    county_local_other:
      label: "Other TxDOT Roadways"
      line_color: "#808080"  # muted gray -- visually subordinate to state routes
      line_width: 1.0
      # On-system safety-net only, as of the Other-Public-Roadways split
      # (see docs/SOURCE_AUDIT.md-adjacent hierarchy work): every currently
      # -known on-system HSYS code already resolves to one of the 5 named
      # categories above, so this folder is expected to stay empty in
      # practice -- it exists so a future/unrecognized on-system code still
      # renders loudly instead of silently vanishing. Off-system roads
      # (CR/LS/FD/TL) no longer land here -- see "Other Public Roadways"
      # below.
    county_road:
      label: "County Roads"
      line_color: "#B8860B"  # dark goldenrod
      line_width: 1.0
    city_street:
      label: "City Streets"
      line_color: "#4682B4"  # steel blue
      line_width: 1.0
    regional_mobility_authority:
      label: "Regional Mobility Authority Roads"
      line_color: "#8B4513"  # saddle brown
      line_width: 1.0
    other_unclassified:
      label: "Other / Unclassified"
      line_color: "#A9A9A9"  # dark gray
      line_width: 0.8
    grade_separated_connector:
      label: "Grade-Separated Connectors"
      line_color: "#66CCCC"  # muted cyan -- deliberately faint; reference-only geometry
      line_width: 0.6
      # Google Earth Pro's LineStyle has no dash-pattern property in KML
      # 2.2 -- <gx:LineStyle> extensions and other tricks are unreliable
      # across versions, so we document this instead of shipping a style
      # that silently renders solid. See docs/FIELD_REFERENCE.md.
      dashed: false

visibility_defaults:
  district_boundaries_folder: true
  district_placemarks: true
  district_details_folder: false
  district_detail_folder: false
  county_folder: false
  administrative_boundaries_folder: true   # wrapper; visible so County Boundary shows as before
  county_boundary_folder: true    # visible once its parent county folder is turned on
  city_limits_folder: false       # hidden by default, independently toggleable from its parent
  roadways_folder: true           # visible once its parent county folder is turned on
  route_category_folder: true
  other_public_roadways_folder: true
  other_public_roadway_category_folder: true
  roadway_network_connectors_folder: true   # renamed from reference_geometry_folder
  grade_separated_connectors_folder: true   # now visible by default -- see FIELD_REFERENCE.md

cache:
  directory: "data/cache"
  max_age_hours: 168   # 1 week

output:
  directory: "data/output"
  master_kml_name: "master.kml"
  single_file_kmz_name: "txdot_overlay_single_file.kmz"

simplification:
  enabled: true
  # Degrees (WGS84). ~0.00001 deg is roughly 1m at Texas latitudes; keep this
  # small since roadway geometry is already segmented at short intervals.
  tolerance_degrees: 0.00002
  # Boundary polygons (district/county) are only rendered as outlines, never
  # used for measurement, so they tolerate coarser simplification than roads.
  # This is applied only to the rendered placemark copy -- clipping/spatial
  # joins always use the unsimplified source geometry. District boundaries
  # (25 large multi-county polygons, ~287k vertices total from the source's
  # detailed coastline data) get a coarser tolerance than individual county
  # boundaries since they only need to look right at a statewide zoom level.
  county_boundary_tolerance_degrees: 0.0001    # ~10m
  district_boundary_tolerance_degrees: 0.0005  # ~50m
  # City limits are clipped to the county boundary using the unsimplified
  # source geometry (same raw-vs-render split as counties/districts); this
  # tolerance applies only to the rendered copy.
  city_limits_boundary_tolerance_degrees: 0.0001    # ~10m, same as county boundaries

network:
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 2
  page_size: 2000    # <= each service's maxRecordCount (confirmed: districts/roadways 2000, counties 1000)
