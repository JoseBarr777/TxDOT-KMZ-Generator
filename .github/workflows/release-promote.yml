name: Release (Promote)

# Production promotion by pointer. Given a release_id, this workflow proves
# the release is a verified, contract-compliant candidate, then -- only once
# every check has passed -- writes current.json at the bucket root to point
# at it. The checks live in scripts/release/promote_check.py:
#   releases/<release_id>/manifest.json exists (current layout only; legacy
#   releases/test-<release_id>/ is not promotable), passes the release gate
#   (scripts/release/gate.py), verified/<release_id>.json exists, is a valid
#   record for this release, and its manifest_sha256 matches the exact remote
#   manifest bytes, and the prefix holds exactly artifacts + 1 objects.
# Rollback is promoting an older release that still satisfies all of that.
#
# Two triggers share the one job below. workflow_dispatch is manual promotion
# (and rollback): require_newer is not an input there, so it is always off.
# workflow_call is for a caller that promotes automatically: require_newer
# defaults to true, adding promote_check.py --require-newer so a stale rerun
# can never replace a newer current release. The mode comes only from that
# input -- never from github.event_name, which in a called workflow is the
# caller's event. A caller needs `secrets: inherit` for the R2 credentials.
#
# The release artifacts under releases/**/ are never rebuilt, renamed,
# copied, or moved by this workflow; the only mutating R2 call anywhere in
# this file is the PutObject of current.json itself (via `aws s3 cp`). There
# is no CopyObject/DeleteObject/sync call anywhere in this file, and no
# release prefix or verification record is ever written to.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release ID to validate, e.g. 2026-09-17T2000Z-1b8b3cc"
        required: true
        type: string
      confirm_release_id:
        description: "Re-type the release_id above to confirm"
        required: true
        type: string
  workflow_call:
    inputs:
      release_id:
        description: "Release ID to promote"
        required: true
        type: string
      confirm_release_id:
        description: "Same value as release_id (the confirmation check still runs)"
        required: true
        type: string
      require_newer:
        description: "Refuse unless the release is newer than the current one"
        required: false
        type: boolean
        default: true

# Read-only repository access, for the release tooling in scripts/release/.
permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    # Job-level, not workflow-level, so manual dispatches and workflow_call
    # runs (inside a caller's own run) serialize on the same group: promotion
    # reads current.json and later writes it, so two must never interleave.
    concurrency:
      group: txdot-kmz-promote
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release_id input
        # Inputs are taken via env vars, never interpolated directly into
        # the script body via ${{ }}, because workflow_dispatch string
        # inputs are attacker-controllable text and direct interpolation
        # into a run: block is a shell-injection vector. The regex below is
        # also the path-traversal defense: release_id may only contain
        # digits/T/Z/hyphens/lowercase-hex, so it can never contain "/" or
        # "..", which is what makes it safe to concatenate into an S3 key
        # later without any further sanitization. (promote_check.py applies
        # the same pattern again, from record_verification.py.)
        id: validate_inputs
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM_RELEASE_ID: ${{ inputs.confirm_release_id }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_ID}" != "${CONFIRM_RELEASE_ID}" ]]; then
            echo "::error::release_id and confirm_release_id do not match"
            exit 1
          fi

          # Must match the exact shape release-staging.yml's "Compute
          # release ID" step produces: date -u +'%Y-%m-%dT%H%MZ' + '-' +
          # git short SHA (7-40 lowercase hex chars; git widens the
          # abbreviation on collision, so the length is not fixed at 7).
          pattern='^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3])[0-5][0-9]Z-[0-9a-f]{7,40}$'
          if ! [[ "${RELEASE_ID}" =~ ${pattern} ]]; then
            echo "::error::release_id '${RELEASE_ID}' does not match the expected <UTC timestamp>-<git short sha> format, e.g. 2026-09-17T2000Z-1b8b3cc"
            exit 1
          fi

          echo "release_id format OK."
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify aws CLI is available
        run: aws --version

      - name: R2 preflight (bucket name + access)
        # Identical shape check to release-staging.yml's preflight -- same
        # cheap fail-fast, same credentials/bucket, no reason to diverge.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          set -euo pipefail

          if [[ "${CF_R2_BUCKET}" =~ ^[[:space:]] ]] || [[ "${CF_R2_BUCKET}" =~ [[:space:]]$ ]]; then
            echo "::error::CF_R2_BUCKET has leading or trailing whitespace"
            exit 1
          fi

          if ! [[ "${CF_R2_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' does not match S3 bucket-name shape (3-63 chars, lowercase letters/digits/dots/hyphens, must start and end with a letter or digit)"
            exit 1
          fi

          if [[ "${CF_R2_BUCKET}" == *".."* ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' contains consecutive periods, which S3 bucket names disallow"
            exit 1
          fi

          if [[ "${CF_R2_BUCKET}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' is formatted like an IP address, which S3 bucket names disallow"
            exit 1
          fi

          echo "Bucket name shape OK: ${CF_R2_BUCKET}"

          endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if ! aws s3api head-bucket --bucket "${CF_R2_BUCKET}" --endpoint-url "${endpoint}"; then
            echo "::error::head-bucket failed -- configured credentials cannot access bucket '${CF_R2_BUCKET}'"
            exit 1
          fi

          echo "R2 preflight passed: bucket is reachable with the configured credentials."

      - name: Check promotion candidate
        # Read-only (head-object, s3 cp downloads, list-objects-v2). Every
        # candidate rule lives in scripts/release/promote_check.py, which
        # reuses gate.py and record_verification.py rather than restating
        # them. current.json is only read here; it is written in a later
        # step, and only if this one passed.
        id: validate_release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          RELEASE_ID: ${{ steps.validate_inputs.outputs.release_id }}
          # "true"/"false" from workflow_call's boolean input; empty under
          # workflow_dispatch, which has no such input (manual: off).
          REQUIRE_NEWER: ${{ inputs.require_newer }}
        run: |
          set -euo pipefail

          ordering_flag=""
          case "${REQUIRE_NEWER}" in
            true)
              ordering_flag="--require-newer"
              echo "Mode: automatic (candidate must be newer than the current release)"
              ;;
            false | "")
              echo "Mode: manual (older verified releases may be promoted -- rollback)"
              ;;
            *)
              echo "::error::unexpected require_newer value '${REQUIRE_NEWER}'"
              exit 1
              ;;
          esac

          python3 scripts/release/promote_check.py \
            --bucket "${CF_R2_BUCKET}" \
            --release-id "${RELEASE_ID}" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            ${ordering_flag:+"${ordering_flag}"} \
            --github-output "${GITHUB_OUTPUT}"

      - name: Construct and validate current.json locally
        # Pure local file construction + validation -- no R2 call in this
        # step at all. The upload happens only in the next step, and only
        # once this one has confirmed the local file is well-formed.
        id: build_current_json
        env:
          RELEASE_ID: ${{ steps.validate_release.outputs.release_id }}
          GIT_SHA_SHORT: ${{ steps.validate_release.outputs.git_sha_short }}
          RESOLVED_PREFIX: ${{ steps.validate_release.outputs.release_prefix }}
          CURRENT_RELEASE_ID: ${{ steps.validate_release.outputs.current_release_id }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          release_id = os.environ["RELEASE_ID"]
          git_sha_short = os.environ["GIT_SHA_SHORT"]
          resolved_prefix = os.environ["RESOLVED_PREFIX"]
          current_release_id = os.environ.get("CURRENT_RELEASE_ID", "")

          # Empty string (GITHUB_OUTPUT's only way to pass "no value") means
          # this is the first promotion ever -- current.json does not exist
          # yet -- so previous_release_id must be JSON null, not "" or
          # "none".
          previous_release_id = current_release_id if current_release_id else None

          promoted_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          doc = {
              "schema_version": 1,
              "release_id": release_id,
              "release_prefix": resolved_prefix,
              "manifest_path": "manifest.json",
              "git_sha_short": git_sha_short,
              "promoted_at": promoted_at,
              "previous_release_id": previous_release_id,
          }

          local_path = Path(os.environ["RUNNER_TEMP"]) / "current.json"
          local_path.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")

          # Re-read from disk (not from the `doc` dict in memory) so this
          # validates exactly the bytes that are about to be uploaded.
          with local_path.open(encoding="utf-8") as fh:
              reloaded = json.load(fh)

          failures = []
          for field in (
              "schema_version", "release_id", "release_prefix", "manifest_path",
              "git_sha_short", "promoted_at", "previous_release_id",
          ):
              if field not in reloaded:
                  failures.append(f"current.json is missing required field '{field}'")

          if reloaded.get("schema_version") != 1:
              failures.append(f"schema_version is {reloaded.get('schema_version')!r}, expected integer 1")
          if reloaded.get("release_id") != release_id:
              failures.append(f"release_id {reloaded.get('release_id')!r} != target {release_id!r}")
          if reloaded.get("release_prefix") != resolved_prefix:
              failures.append(f"release_prefix {reloaded.get('release_prefix')!r} != resolved prefix {resolved_prefix!r}")
          if reloaded.get("manifest_path") != "manifest.json":
              failures.append(f"manifest_path {reloaded.get('manifest_path')!r} != 'manifest.json'")
          if reloaded.get("git_sha_short") != git_sha_short:
              failures.append(f"git_sha_short {reloaded.get('git_sha_short')!r} != validated short SHA {git_sha_short!r}")
          if not reloaded.get("promoted_at"):
              failures.append("promoted_at is missing or empty")

          prev = reloaded.get("previous_release_id")
          if prev is not None and not isinstance(prev, str):
              failures.append(f"previous_release_id must be a string or null, got {type(prev).__name__}")
          elif prev != previous_release_id:
              failures.append(f"previous_release_id {prev!r} != expected {previous_release_id!r}")

          if failures:
              for reason in failures:
                  print(f"::error::current.json local validation failed: {reason}")
              sys.exit(1)

          local_sha256 = hashlib.sha256(local_path.read_bytes()).hexdigest()

          print("Proposed current.json contents (not yet uploaded):")
          print(json.dumps(reloaded, indent=2))
          print(f"Local sha256: {local_sha256}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out_fh:
              out_fh.write(f"local_sha256={local_sha256}\n")
          PY

      - name: Upload current.json to R2
        # The only mutating R2 call in this entire workflow. It writes
        # exactly one key, current.json, at the bucket root. It never
        # touches anything under releases/**/.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          set -euo pipefail
          endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp "${RUNNER_TEMP}/current.json" "s3://${CF_R2_BUCKET}/current.json" \
            --endpoint-url "${endpoint}" \
            --content-type "application/json" \
            --cache-control "no-cache, must-revalidate"

          echo "Uploaded current.json to s3://${CF_R2_BUCKET}/current.json"

      - name: Read-back verify current.json
        # Downloads current.json back from R2 and checks it byte-for-byte
        # (via sha256) and field-for-field against what was uploaded. This
        # step is itself read-only against R2 -- it only ever issues s3 cp
        # (download). If anything here fails, the workflow fails loudly and
        # explicitly declines to attempt an automatic rollback.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          RELEASE_ID: ${{ steps.validate_release.outputs.release_id }}
          GIT_SHA_SHORT: ${{ steps.validate_release.outputs.git_sha_short }}
          RESOLVED_PREFIX: ${{ steps.validate_release.outputs.release_prefix }}
          CURRENT_RELEASE_ID: ${{ steps.validate_release.outputs.current_release_id }}
          LOCAL_SHA256: ${{ steps.build_current_json.outputs.local_sha256 }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          bucket = os.environ["CF_R2_BUCKET"]
          account_id = os.environ["CF_ACCOUNT_ID"]
          endpoint = f"https://{account_id}.r2.cloudflarestorage.com"
          release_id = os.environ["RELEASE_ID"]
          git_sha_short = os.environ["GIT_SHA_SHORT"]
          resolved_prefix = os.environ["RESOLVED_PREFIX"]
          current_release_id = os.environ.get("CURRENT_RELEASE_ID", "")
          expected_previous = current_release_id if current_release_id else None
          local_sha256 = os.environ["LOCAL_SHA256"]

          readback_path = Path(os.environ["RUNNER_TEMP"]) / "current-readback.json"

          result = subprocess.run(
              ["aws", "s3", "cp", f"s3://{bucket}/current.json", str(readback_path), "--endpoint-url", endpoint],
              capture_output=True,
              text=True,
          )
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              print("::error::Read-back download of current.json failed after upload -- current.json may already have changed and requires manual inspection. No automatic rollback was attempted.")
              sys.exit(1)

          remote_bytes = readback_path.read_bytes()
          remote_sha256 = hashlib.sha256(remote_bytes).hexdigest()

          failures = []
          if remote_sha256 != local_sha256:
              failures.append(f"sha256 mismatch: uploaded {local_sha256}, downloaded {remote_sha256}")

          try:
              remote_doc = json.loads(remote_bytes)
          except json.JSONDecodeError as exc:
              print(f"::error::downloaded current.json is not valid JSON: {exc}")
              print("::error::current.json may already have changed and requires manual inspection. No automatic rollback was attempted.")
              sys.exit(1)

          if remote_doc.get("schema_version") != 1:
              failures.append(f"schema_version {remote_doc.get('schema_version')!r} != 1")
          if remote_doc.get("release_id") != release_id:
              failures.append(f"release_id {remote_doc.get('release_id')!r} != {release_id!r}")
          if remote_doc.get("release_prefix") != resolved_prefix:
              failures.append(f"release_prefix {remote_doc.get('release_prefix')!r} != {resolved_prefix!r}")
          if remote_doc.get("manifest_path") != "manifest.json":
              failures.append(f"manifest_path {remote_doc.get('manifest_path')!r} != 'manifest.json'")
          if remote_doc.get("git_sha_short") != git_sha_short:
              failures.append(f"git_sha_short {remote_doc.get('git_sha_short')!r} != {git_sha_short!r}")
          if remote_doc.get("previous_release_id") != expected_previous:
              failures.append(f"previous_release_id {remote_doc.get('previous_release_id')!r} != {expected_previous!r}")
          if not remote_doc.get("promoted_at"):
              failures.append("promoted_at missing or empty in downloaded current.json")

          if failures:
              for reason in failures:
                  print(f"::error::Read-back verification failed: {reason}")
              print("::error::current.json may already have changed and requires manual inspection. No automatic rollback was attempted.")
              sys.exit(1)

          print("Read-back verification passed: uploaded current.json matches the validated content byte-for-byte.")
          PY

      - name: Print promotion summary
        env:
          RELEASE_ID: ${{ steps.validate_release.outputs.release_id }}
          GIT_SHA_SHORT: ${{ steps.validate_release.outputs.git_sha_short }}
          RESOLVED_PREFIX: ${{ steps.validate_release.outputs.release_prefix }}
          CURRENT_RELEASE_ID: ${{ steps.validate_release.outputs.current_release_id }}
        run: |
          set -euo pipefail
          previous="${CURRENT_RELEASE_ID:-none}"

          echo "Promotion PASSED"
          echo ""
          echo "Previous release: ${previous}"
          echo "Current release: ${RELEASE_ID}"
          echo "Release prefix: ${RESOLVED_PREFIX}"
          echo "Manifest: manifest.json"
          echo "git_sha_short: ${GIT_SHA_SHORT}"
          echo "current.json verified: YES"
