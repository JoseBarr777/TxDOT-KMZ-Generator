name: Release (Staging)

# v1: staging-only release. Builds the statewide artifact set, gates on a
# complete manifest, and uploads to a versioned/immutable release prefix in
# R2. Deployment state (whether a release is live) belongs in current.json,
# not in this prefix name, so the prefix names artifact identity only.
# Deliberately does NOT touch current.json or promote a production release --
# that is a later phase (see release-promote.yml) once this staging path has
# been exercised manually.
on:
  workflow_dispatch:

concurrency:
  group: txdot-kmz-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify aws CLI is available
        # Fail fast, before the statewide build, if the runner image ever
        # loses/changes its bundled aws-cli -- upload/verify depend on it.
        run: aws --version

      - name: R2 preflight (bucket name + access)
        # Fail fast, before the statewide build, on a misconfigured
        # CF_R2_BUCKET or credentials that can't reach it -- catching this
        # now instead of after ~254 counties are built saves the whole
        # build's runtime on a config mistake.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          set -euo pipefail

          if [[ "${CF_R2_BUCKET}" =~ ^[[:space:]] ]] || [[ "${CF_R2_BUCKET}" =~ [[:space:]]$ ]]; then
            echo "::error::CF_R2_BUCKET has leading or trailing whitespace"
            exit 1
          fi

          # S3 bucket-name shape: 3-63 chars, lowercase letters/digits/dots/
          # hyphens, must start and end with a letter or digit.
          if ! [[ "${CF_R2_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' does not match S3 bucket-name shape (3-63 chars, lowercase letters/digits/dots/hyphens, must start and end with a letter or digit)"
            exit 1
          fi

          if [[ "${CF_R2_BUCKET}" == *".."* ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' contains consecutive periods, which S3 bucket names disallow"
            exit 1
          fi

          if [[ "${CF_R2_BUCKET}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::CF_R2_BUCKET '${CF_R2_BUCKET}' is formatted like an IP address, which S3 bucket names disallow"
            exit 1
          fi

          echo "Bucket name shape OK: ${CF_R2_BUCKET}"

          endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if ! aws s3api head-bucket --bucket "${CF_R2_BUCKET}" --endpoint-url "${endpoint}"; then
            echo "::error::head-bucket failed -- configured credentials cannot access bucket '${CF_R2_BUCKET}'"
            exit 1
          fi

          echo "R2 preflight passed: bucket is reachable with the configured credentials."

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Assert cold GIS source cache
        # Production freshness guarantee: every release fetches all GIS
        # source data (3 statewide layers + 254 per-county roadway queries)
        # during this staging run. That holds today only because each run
        # gets a fresh GitHub-hosted runner and data/cache is gitignored and
        # never restored (no actions/cache, no artifact download). This
        # turns that into an enforced invariant: if data/cache was ever
        # pre-populated -- a cache restore, a self-hosted runner, a leftover
        # workspace -- the release fails here, before the statewide build,
        # instead of silently building from days-old source data. Nothing is
        # deleted; the cause is left visible. (Deliberately no
        # --force-refresh anywhere in this workflow: on a cold cache it is
        # redundant, and on the post-build commands it would re-fetch
        # districts/counties and split the release across two source
        # snapshots.)
        run: |
          set -euo pipefail
          if [[ ! -d data/cache ]]; then
            echo "::error::data/cache is missing; expected the tracked placeholder directory"
            exit 1
          fi
          leftover="$(find data/cache -mindepth 1 ! -name .gitkeep -print -quit)"
          if [[ -n "${leftover}" ]]; then
            echo "::error::data/cache is not empty (found ${leftover}); releases must fetch GIS source data fresh during this run"
            exit 1
          fi
          echo "GIS source cache is cold: all source data will be fetched during this run."

      - name: Build statewide artifacts
        run: uv run python -m txdot_overlay build-all

      - name: Validate output
        run: uv run python -m txdot_overlay validate-output

      - name: Validate offline packages
        # Deep check of the District/Statewide bulk ZIPs that build-all
        # produced: exact membership, ZIP_STORED, no directory/duplicate
        # entries, and every embedded county KMZ byte-identical to its
        # standalone canonical KMZ. validate-output never opens the ZIPs and
        # generate-manifest only checks that each one is a non-empty
        # readable archive, so this is the only step that proves their
        # contents. Deliberately no continue-on-error: a failure here must
        # stop the candidate before manifest generation, gating, packaging
        # and upload.
        run: uv run python -m txdot_overlay validate-offline-packages

      - name: Generate manifest
        # generate-manifest (commands/generate_manifest.py) intentionally
        # returns 0 only when manifest.complete is True, else 1 -- by
        # design, independent of validate-output. continue-on-error is
        # required here, not optional: GitHub Actions skips all subsequent
        # steps by default once one fails, so without it the completeness
        # gate below -- the step meant to diagnose exactly this case, with
        # its own printed summary -- would never run for an incomplete
        # manifest, and the job would fail on this step's bare exit code
        # instead of a clear, itemized reason.
        continue-on-error: true
        run: uv run python -m txdot_overlay generate-manifest

      - name: Enforce release completeness gate
        # Policy lives in scripts/release/gate.py (stdlib only, bare python3).
        run: python3 scripts/release/gate.py --manifest data/output/manifest.json

      - name: Package release tree from manifest
        # THE release invariant: what ships to R2 is defined by manifest.json,
        # never by whatever happens to sit in data/output/. This step copies
        # manifest.json plus exactly the paths manifest["artifacts"] declares
        # into a clean release-stage/ tree, and every later step (upload and
        # verification) reads only from release-stage/. Anything undeclared --
        # the checked-out data/output/.gitkeep that broke staging run #2,
        # .DS_Store, editor temp files, debug dumps, a future artifact type
        # the manifest builder does not yet advertise -- is structurally
        # unable to reach R2, because it is never copied here in the first
        # place. This is an allowlist, not an exclude list.
        # Allowlist logic lives in scripts/release/package.py.
        run: python3 scripts/release/package.py --source-dir data/output --stage-dir release-stage

      - name: Compute release ID
        id: release
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H%MZ')"
          short_sha="$(git rev-parse --short HEAD)"
          release_id="${timestamp}-${short_sha}"
          echo "Release ID: ${release_id}"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Check release prefix is unused
        # Release prefixes are immutable, and the upload below is aws s3
        # sync without --delete: syncing into an occupied prefix would
        # overwrite it in place and keep stale objects. Guard logic lives in
        # scripts/release/check_prefix.py; it lists at most one key under
        # releases/<id>/ and fails if any object exists or the listing
        # fails. No continue-on-error / if: a failure here skips upload and
        # verification.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 scripts/release/check_prefix.py \
            --bucket "${CF_R2_BUCKET}" \
            --release-id "${RELEASE_ID}" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Upload release to R2 (staging)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          dest="s3://${CF_R2_BUCKET}/releases/${RELEASE_ID}/"

          echo "Bucket: ${CF_R2_BUCKET}"
          echo "Upload prefix: releases/${RELEASE_ID}/"

          # Source is release-stage/, never data/output/: only files the
          # manifest declared were packaged there, so an undeclared file
          # cannot be swept up by the catch-all pass the way data/output/
          # .gitkeep was in staging run #2.
          #
          # aws s3 sync infers .json correctly but does not know .kml/.kmz,
          # so those two extensions get an explicit --content-type pass.
          # The bulk-download ZIPs (offline/*.zip) also get an explicit
          # application/zip pass: they are a primary download product, so
          # their Content-Type is declared rather than left to the CLI's
          # mimetypes guess, which depends on the runner image.
          # The four passes below partition release-stage/ by extension --
          # *.kml, *.kmz, *.zip, then everything else excluding all three --
          # so each file is touched by exactly one pass. The final
          # (catch-all) pass explicitly excludes *.kml, *.kmz and *.zip and
          # therefore can never re-sync and overwrite the content-type/
          # cache-control already set on those files by the earlier passes.
          # Cache-Control is long/immutable on all four passes since this
          # prefix is versioned and never overwritten in place.
          aws s3 sync release-stage/ "${dest}" \
            --endpoint-url "${endpoint}" \
            --exclude "*" --include "*.kml" \
            --content-type "application/vnd.google-earth.kml+xml" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          aws s3 sync release-stage/ "${dest}" \
            --endpoint-url "${endpoint}" \
            --exclude "*" --include "*.kmz" \
            --content-type "application/vnd.google-earth.kmz" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          aws s3 sync release-stage/ "${dest}" \
            --endpoint-url "${endpoint}" \
            --exclude "*" --include "*.zip" \
            --content-type "application/zip" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          aws s3 sync release-stage/ "${dest}" \
            --endpoint-url "${endpoint}" \
            --exclude "*.kml" --exclude "*.kmz" --exclude "*.zip" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          echo "Upload complete."

      - name: Verify staged release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        # Checks live in scripts/release/verify.py; it compares the remote
        # prefix against release-stage/ via the aws CLI.
        run: |
          set -euo pipefail
          python3 scripts/release/verify.py \
            --bucket "${CF_R2_BUCKET}" \
            --release-id "${RELEASE_ID}" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --stage-dir release-stage
