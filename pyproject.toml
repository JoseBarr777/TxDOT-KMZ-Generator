[project]
name = "txdot-overlay"
version = "0.1.0"
description = "Downloads, processes, styles, and exports public TxDOT ArcGIS vector data as a Google Earth Pro overlay."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "requests>=2.31",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "simplekml>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[project.scripts]
txdot-overlay = "txdot_overlay.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: exercises a live external service call (may be served from the on-disk cache); excluded from CI's fast job via `pytest -m \"not network\"`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade (safe, py3.10+ only)
    "B",  # flake8-bugbear
]
# E501: long, deliberately-written docstring/comment lines are this
# codebase's established style (see e.g. processing/classify.py,
# config/config.yaml) -- not reflowing carefully written prose to satisfy
# a line-length rule.
# B905/B007: real findings in processing/classify.py, diagnostics.py,
# audit_data.py, and one test -- deferred past this tooling-only phase
# since fixing them means editing processing/test logic, not just config.
ignore = ["E501", "B905", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["txdot_overlay"]
